<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | ZANDF</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="dashboard-body">

  <!-- Auth gate: dashboard.js hides this and redirects if not logged in -->
  <div id="authGate" class="auth-gate">
    <div class="spinner"></div>
    <p>Checking session…</p>
  </div>

  <div id="dashboardApp" class="dashboard-app" hidden>

    <!-- ===== Sidebar ===== -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="login-logo-text">ZAND<span>F</span></span>
        <p>Admin Console</p>
      </div>

      <nav class="sidebar-nav">
        <button class="sidebar-link active" data-panel="panel-hero">
          <i class="fa-solid fa-house"></i> Hero
        </button>
        <button class="sidebar-link" data-panel="panel-about">
          <i class="fa-solid fa-circle-info"></i> About
        </button>
        <button class="sidebar-link" data-panel="panel-services">
          <i class="fa-solid fa-layer-group"></i> Services
        </button>
        <button class="sidebar-link" data-panel="panel-testimonials">
          <i class="fa-solid fa-quote-left"></i> Testimonials
        </button>
        <button class="sidebar-link" data-panel="panel-contact">
          <i class="fa-solid fa-envelope"></i> Contact Info
        </button>
      </nav>

      <div class="sidebar-footer">
        <a href="index.html" target="_blank" class="sidebar-ghost-btn">
          <i class="fa-solid fa-up-right-from-square"></i> View Site
        </a>
        <button id="logoutBtn" class="sidebar-ghost-btn sidebar-logout">
          <i class="fa-solid fa-right-from-bracket"></i> Log Out
        </button>
      </div>
    </aside>

    <!-- ===== Main content ===== -->
    <main class="dashboard-main">
      <header class="dashboard-topbar">
        <div>
          <h1 id="panelTitle">Hero Section</h1>
          <p id="panelDesc">Edit the headline visitors see first.</p>
        </div>
        <div class="topbar-actions">
          <button id="resetBtn" class="btn-secondary-sm">
            <i class="fa-solid fa-rotate-left"></i> Reset to Defaults
          </button>
          <button id="saveBtn" class="btn-primary-sm">
            <i class="fa-solid fa-floppy-disk"></i> Save Changes
          </button>
        </div>
      </header>

      <p class="save-toast" id="saveToast" role="status" aria-live="polite"></p>

      <form id="contentForm" class="dashboard-form">

        <!-- Hero panel -->
        <section class="panel active" id="panel-hero">
          <div class="field-group">
            <label for="hero_gradientText">Highlighted headline (gradient text)</label>
            <input type="text" id="hero_gradientText" maxlength="60">
            <span class="field-hint">Appears in the middle line of the hero: "We Build / <em>this</em> / That
              Matter".</span>
          </div>
          <div class="field-group">
            <label for="hero_description">Hero description</label>
            <textarea id="hero_description" rows="3" maxlength="220"></textarea>
          </div>
          <div class="field-row">
            <div class="field-group">
              <label for="hero_statProjects">Stat — Projects Delivered</label>
              <input type="text" id="hero_statProjects" maxlength="12">
            </div>
            <div class="field-group">
              <label for="hero_statClients">Stat — Happy Clients</label>
              <input type="text" id="hero_statClients" maxlength="12">
            </div>
            <div class="field-group">
              <label for="hero_statYears">Stat — Years of Experience</label>
              <input type="text" id="hero_statYears" maxlength="12">
            </div>
          </div>
        </section>

        <!-- About panel -->
        <section class="panel" id="panel-about">
          <div class="field-group">
            <label for="about_gradientText">Highlighted title (gradient text)</label>
            <input type="text" id="about_gradientText" maxlength="40">
            <span class="field-hint">Appears as: "Crafting Digital <em>this</em>".</span>
          </div>
          <div class="field-group">
            <label for="about_subtitle">About paragraph</label>
            <textarea id="about_subtitle" rows="4" maxlength="320"></textarea>
          </div>
        </section>

        <!-- Services panel -->
        <section class="panel" id="panel-services">
          <div id="servicesFields"></div>
        </section>

        <!-- Testimonials panel -->
        <section class="panel" id="panel-testimonials">
          <div id="testimonialsFields"></div>
        </section>

        <!-- Contact panel -->
        <section class="panel" id="panel-contact">
          <div class="field-row">
            <div class="field-group">
              <label for="contact_email">Contact email</label>
              <input type="email" id="contact_email" maxlength="80">
            </div>
            <div class="field-group">
              <label for="contact_phone">Contact phone</label>
              <input type="text" id="contact_phone" maxlength="30">
            </div>
          </div>
          <p class="field-hint">Updates the "Send Message" section links and the footer contact details.</p>
        </section>

      </form>
    </main>
  </div>

  <script src="dashboard.js"></script>
</body>

</html>
